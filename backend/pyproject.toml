[project]
name = "careflow-ai"
version = "0.1.0"
description = "Synthetic hospital administrative workflow demonstration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy==2.0.48",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "pypdf>=5,<7", "python-multipart>=0.0.20,<1",
  "itsdangerous>=2.2,<3", "reportlab>=4,<6"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.14,<3"]
voice = ["faster-whisper>=1.1,<2", "piper-tts>=1.3,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/careflow"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

